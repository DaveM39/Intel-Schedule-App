name: Android CI

on:
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Android verification
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintDebug assembleDebug
